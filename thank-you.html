<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | MemoriaLife</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        .glass-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e6f4ea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .checkmark svg {
            width: 40px;
            height: 40px;
            stroke: #22c55e;
            stroke-width: 3;
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

    <div class="glass-card p-8 md:p-10 max-w-md w-full text-center fade-in">

        <!-- Logo -->
        <div class="mb-6">
            <h1 class="text-2xl font-serif text-gray-800">MemoriaLife</h1>
        </div>

        <!-- Success Icon -->
        <div class="checkmark">
            <svg fill="none" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7"/>
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-semibold text-gray-800 mb-2">
            Payment Successful 🎉
        </h2>

        <p class="text-gray-500 text-sm mb-6">
            Your order has been confirmed. We’ll contact you shortly.
        </p>

        <!-- Details -->
        <div class="bg-gray-50 rounded-lg p-5 text-sm text-gray-600 mb-6 text-left space-y-2">

            <p><strong>Transaction ID:</strong><br>
                <span id="txnid" class="text-gray-800 font-medium"></span>
            </p>

            <p><strong>Name:</strong><br>
                <span id="name" class="text-gray-800 font-medium"></span>
            </p>

            <p><strong>Email:</strong><br>
                <span id="email" class="text-gray-800 font-medium"></span>
            </p>

            <p><strong>Phone:</strong><br>
                <span id="phone" class="text-gray-800 font-medium"></span>
            </p>

            <p><strong>Amount Paid:</strong><br>
                ₹<span id="amount" class="text-gray-800 font-medium"></span>
            </p>

        </div>

        <!-- Button -->
        <a href="https://memorialife.online"
           class="inline-block w-full py-3 rounded-full bg-gray-800 text-white text-sm font-medium hover:bg-black transition">
            Back to Home
        </a>

    </div>

    <!-- SCRIPT -->
    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("txnid").innerText = params.get("txnid") || "N/A";
        document.getElementById("name").innerText = params.get("name") || "N/A";
        document.getElementById("email").innerText = params.get("email") || "N/A";
        document.getElementById("phone").innerText = params.get("phone") || "N/A";
        document.getElementById("amount").innerText = params.get("amount") || "0";
    </script>

</body>
</html>
